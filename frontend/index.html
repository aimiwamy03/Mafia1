<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Town</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1a17; overflow: hidden; font-family: "Courier New", monospace; }
    #game { display: block; margin: 0 auto; }
    #hud {
      position: fixed; left: 12px; top: 12px; color: #f4e7c8; font-size: 13px;
      text-shadow: 0 1px 0 #000; pointer-events: none; z-index: 2;
    }
    #panel {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 5; align-items: center; justify-content: center;
    }
    #panel.open { display: flex; }
    #card {
      width: min(520px, 92vw); background: #2b2419; color: #f4e7c8;
      border: 4px solid #c9a15b; padding: 18px 20px; box-shadow: 0 8px 0 #111;
    }
    #card h2 { margin: 0 0 8px; font-size: 18px; }
    #card p, #card label { margin: 0 0 10px; line-height: 1.35; }
    #card input, #card textarea {
      width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px;
      background: #1b1a17; color: #f4e7c8; border: 2px solid #c9a15b; font: inherit;
    }
    #card button {
      background: #c9a15b; color: #1b1a17; border: 0; padding: 8px 14px;
      font: inherit; font-weight: bold; cursor: pointer; margin-right: 8px;
    }
    #card img { max-width: 100%; display: block; margin-top: 8px; border: 2px solid #c9a15b; }
    #library-chat {
      max-height: 230px; overflow-y: auto; margin: 8px 0 10px; padding: 8px;
      background: #1b1a17; border: 2px solid #765d37;
    }
    .chat-line { margin: 0 0 8px; line-height: 1.35; white-space: pre-wrap; }
    .chat-line strong { color: #e6c27a; }
    .coin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .coin-card { padding: 10px; background: #1b1a17; border: 2px solid #765d37; }
    .coin-card strong { display: block; color: #e6c27a; margin-bottom: 4px; }
    .up { color: #79d69a; } .down { color: #e98282; }
    #status { min-height: 1.2em; color: #e6c27a; }
  </style>
</head>
<body>
  <div id="hud">AI Town — WASD / arrows to walk. Enter a doorway.</div>
  <div id="panel">
    <div id="card">
      <h2 id="panel-title">Store</h2>
      <p id="panel-body"></p>
      <div id="panel-form"></div>
      <div id="status"></div>
      <button type="button" id="panel-close">Leave</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
